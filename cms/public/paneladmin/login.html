<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Panel de administración</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/paneladmin/css/admin.css">
</head>
<body class="login-body">

<div class="login-card">
  <div class="login-brand">Not<span>App</span></div>
  <p class="login-sub">Panel de administración</p>

  <form id="loginForm" novalidate>
    <label class="field">
      <span>Correo electrónico</span>
      <input type="email" id="email" name="email" autocomplete="username" required>
    </label>
    <label class="field">
      <span>Contraseña</span>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </label>

    <p class="login-error" id="loginError" hidden></p>

    <button type="submit" class="btn-admin btn-admin-primary btn-admin-block" id="loginBtn">Ingresar</button>
  </form>

  <p class="login-hint">Acceso restringido. Si perdiste tus credenciales, pedile al equipo que desarrolló el sistema que las restablezca.</p>
</div>

<script src="/paneladmin/js/admin.js" data-page="login"></script>
</body>
</html>
